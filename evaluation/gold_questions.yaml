# Gold questions for the ma-rag evaluation (see docs/EVALUATION.md).
#
# Source of truth: datasets/ai-earnings-desk/INDEXING_PLAN.md §6. `question` and `reference` are
# copied from that table word for word, and tests/test_eval_scoring.py checks that they still match.
#
# Fields:
#   group     xlsx | docs | cross | behaviour: the scorecard's columns
#   route     graph: MultiAgentRAG's graph, in-process. api: POST /api/v1/query through TestClient
#   expect    answer | refuse_irrelevant | refuse_unsafe | block_input
#   sources   the exact source_file values in the index that hold the answer
#   numbers   figures the answer must contain, written as the verified answer writes them. Signs are
#             ignored: "−$5,855M", "($5,855M)" and "a loss of $5.9 billion" all match "$5,855M"
#   mentions  [{any: [regex, ...], required: bool}], case-insensitive
#   turns     multi-turn items only: the questions sent, in order, each with its own checks
#
# Numbers that already appear in a question are left out, so repeating the question earns nothing.

- id: 1
  question: "Which company had the highest revenue in calendar Q2 2026?"
  shows: "A2A XLSX before/after"
  group: xlsx
  route: [graph]
  expect: answer
  reference: "Alphabet, $119,796M. Runner-up NVIDIA, $96,221M"
  sources: [ai_earnings_comparison.xlsx]
  numbers:
    - {text: "$119,796M", required: true}
    - {text: "$96,221M", required: false}
  mentions:
    - {any: ['Alphabet|Google'], required: true}
    - {any: ['NVIDIA'], required: false}

