- id: 133
  question: How does the comparison workbook's Definitions sheet define a calendar quarter and a fiscal period?
  kind: lookup
  expect: answer
  difficulty: easy
  route: [graph]
  companies: []
  vertical: {op: list, sheet: Definitions, chunks: 1}
  reference: The comparison workbook's Definitions sheet defines a company's calendar quarter as the calendar quarter that holds the midpoint of its fiscal quarter, so every fiscal quarter maps to exactly one calendar quarter. The Definitions sheet defines the fiscal period as the company's own label, a fiscal year and quarter, where fiscal year N is the one that ends in calendar year N.
  mentions:
  - {any: ['mid-?point|middle|halfway'], required: true}
  - {any: ['own (?:\w+ ){0,4}labels?\b|company''s (?:own )?(?:label|labels|naming|numbering)|labels? (?:its|their) (?:own )?(?:quarters?|periods?)|\bends? in (?:the )?calendar year|calendar year in which it ends|named (?:for|after) the (?:calendar )?year (?:in which )?it ends|(?:fiscal year|FY) ?N\b'], required: true}
  evidence:
  - fact: 'Calendar quarter: meaning holds the midpoint of the company''s fiscal quarter'
    any_of:
    - {files: [ai_earnings_comparison.xlsx], all: ['Definitions - Term ''Calendar quarter'': (?:(?!Definitions - Term '').)*?Meaning is (?:(?!Definitions - Term '').)*?holds the midpoint of the company''s fiscal quarter']}
    - {files: [ai_earnings_comparison.xlsx], all: ['Definitions - column ''Meaning'', by Term: (?:(?! - column '').)*?(?<=[:;] )Calendar quarter is (?:(?! - column '').)*?holds the midpoint of the company''s fiscal quarter']}
  - fact: 'Fiscal period: meaning Fiscal year N is the one that ends in calendar year N'
    any_of:
    - {files: [ai_earnings_comparison.xlsx], all: ['Definitions - Term ''Fiscal period'': (?:(?!Definitions - Term '').)*?Meaning is (?:(?!Definitions - Term '').)*?Fiscal year N is the one that ends in calendar year N']}
    - {files: [ai_earnings_comparison.xlsx], all: ['Definitions - column ''Meaning'', by Term: (?:(?! - column '').)*?(?<=[:;] )Fiscal period is (?:(?! - column '').)*?Fiscal year N is the one that ends in calendar year N']}
  notes: 'Workbook > Definitions, rows ''Calendar quarter'' (the calendar quarter that holds the midpoint of the company''s fiscal quarter; derivation: period start + half the period length) and ''Fiscal period'' (the company''s own label; fiscal year N ends in calendar year N), next to each other in one chunk. Unlike a margin''s formula, the midpoint rule is the workbook''s own convention, so an answer must come from the sheet.'

