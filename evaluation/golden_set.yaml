  notes: 'NVDA_FY2027-Q2_cfo_commentary.pdf p.4 (Balance Sheet and Cash Flow): inventory $31.6B, up from $25.8B sequentially, as NVIDIA prepares for the introduction of Vera Rubin in the third quarter; NVDA_FY2027-Q2_transcript.pdf p.7 (Kress): inventory increased to $32B as NVIDIA prepared for the Vera Rubin launch (same fact, rounded; both files listed). AMD_FY2026-Q2_transcript.pdf p.6 (Jean Hu): inventory increased sequentially to approximately $8.5B to support strong data center demand; the AMD press release balance sheet shows inventories of $8,468M at June 27, 2026 (vs $7,920M at December 27, 2025) but not the reason, so the unit (amount plus reason) names the transcript only. MU_FY2026-Q3_prepared_remarks.pdf p.9 (Mark Murphy): ending inventory $8.6B, 120 days of inventory; DRAM inventories very tight and below 120 days. Sole source (xref ''inventor... 31.6/32 billion/8.5/8.6'', ''days of inventory''): NVIDIA''s figures only in its two files, AMD''s reason only on its call, Micron''s only in its remarks; the workbook has no inventory data. Same chunks as other facts used elsewhere (NVIDIA''s $25.0B notes in draft na-7, Micron''s debt reduction in item 38 and na-7), but different facts. Hard: three files from semiconductor companies in two groups (NVIDIA and Micron, AMD), plus a comparison the answer works out (inventory built for product ramps and demand at NVIDIA and AMD, versus lean DRAM inventory at Micron). VERIFIER: NVDA CFO commentary p.4, NVDA transcript p.7, AMD transcript p.6, AMD release balance sheet (8,468 at June 27, 2026 vs 7,920 at December 27, 2025) and MU remarks p.9 re-read. AMD''s reason (strong data center demand) is now a required mention tied to AMD, so an answer that gives AMD''s amount without its reason is partial.'

