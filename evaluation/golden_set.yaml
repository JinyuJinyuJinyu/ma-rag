# The golden set for evaluating ma-rag (see docs/EVALUATION.md).
#
# Each item is a question about the indexed Tier 1 files (datasets/ai-earnings-desk/index_selection.csv),
# with its verified answer. Both evals use it:
#   - scripts/eval_retrieval.py searches each question and checks the chunks against its `evidence`;
#   - scripts/eval_answers.py asks each question through the app and checks the answer against
#     `numbers`, `mentions` and `forbid`, and has an LLM judge compare it with `reference`.
# evaluation/gold.py loads and checks this file: an item whose reference fails its own checks, or whose
# question already contains a required figure, is rejected.
#
# Fields:
#   id        unique integer. 1-19 are the demo questions of INDEXING_PLAN.md section 6 (same wording)
#   question  sent to the app as is. Every period is anchored ("calendar Q2 2026", "fiscal Q2 2027"),
#             except the demo questions, which keep the demo script's wording
#   kind      lookup | superlative | trend | calendar | guidance | explanation | compare (companies or
#             sources side by side, worked out by the answer) | aggregate (a count, filter, total or average
#             over workbook rows, worked out by the answer) | reconcile | multi_hop | unanswerable
#             | follow_up | refuse_irrelevant | refuse_unsafe | block_input
#   expect    answer | decline (the documents don't hold the answer) | refuse_irrelevant | refuse_unsafe
#             | block_input
#   difficulty easy: a direct lookup, every fact in one passage of one file, asked in the document's
#             own terms. medium: one file but more work (facts in several passages, a paraphrase or an
#             implied period, a fiscal-calendar mapping, a trend, a ranking the workbook states, a later
#             conversation turn), or two files that each hold a direct lookup. hard: three or more files,
#             or two that each need more work; a reconciliation, a multi-hop question or a comparison the
#             answer must work out; an unanswerable question with a close near-miss in the documents; an
#             injection hidden in a real question. gold.py checks the extremes: an easy question needs one
#             file and is none of superlative, trend, calendar, compare, aggregate, reconcile, multi_hop,
#             follow_up; a question that needs three or more files is hard. For a vertical question: easy
#             reads its rows off one chunk (op list); medium applies one operation to rows that fit in the
#             app's top 5 chunks; hard needs more chunks than that, adds or averages the rows, or needs a
#             second file (gold.py checks easy, and that hard is exactly those cases)
#   route     graph: MultiAgentRAG's graph, in-process. api: POST /api/v1/query through TestClient
#             (Content Safety and session memory; follow-up items use it)
#   companies the companies the question is about, for the reports' breakdowns
#   demo      true for the 19 demo questions
#   vertical  {op, sheet, chunks} for a question that reads one workbook column down many rows (items
#             101-148). The Excel narrator writes one sentence per row and the chunker packs a few rows (wide
#             metric sheets) or one row (Quarterly and Annual results) into a chunk, so the answer needs every
#             row's chunk. op: list | max_min | rank | count | filter | sum | average | change | first. sheet:
#             the main sheet read (the one with the fewest chunks). chunks: the fewest row chunks (column views
#             don't count) that hold every evidence unit (check-gold and the tests recompute it on the snapshot). The evidence lists
#             every row the answer must read, also the ones it doesn't name (all eight companies for "the
#             lowest"), up to 30 units; the gold condition hands over every row's chunk
#   reference the full correct answer, for the LLM judge: self-contained (company, metric, period), one
#             fact per sentence. It must contain every required number and mention
#   numbers   figures the answer must contain, written like the source: {text: "$89.0B"}. The answer may
#             round to the precision it writes ("$89 billion", "$88,977M"), but a figure with one significant
#             digit must equal the gold at the gold's precision ("$7 billion" doesn't count for $6.7B); a
#             whole percent always counts. Options: required: false; any_of: [two equally right figures];
#             sign: negative (the answer must show it as negative: a minus, parentheses or "loss"). A
#             figure the question doesn't ask for, such as a superlative's runner-up, is required: false
#   mentions  [{any: [regex, ...], required: bool}], case-insensitive. Never a word from the question
#   forbid    regexes for known wrong conclusions, written as assertions. An answer asserting one is
#             wrong, whatever else it gets right
#   evidence  the retrieval gold: one unit per fact the answer needs. A unit names the indexed files that
#             state the fact and regexes that must all match ONE chunk (case-insensitive, whitespace
#             collapsed): {fact, files: [...], all: [...]}, or {fact, any_of: [{files, all}, ...]} when
#             files word the fact differently (a wide sheet's cell, the Quarterly results row, the narrator's
#             column view of either, a document's statement table). `scripts/eval_retrieval.py check-gold` checks them against the index. A
#             question needs the fewest files that can hold all its units (2 or more: a multi-file
#             question); a file that is a unit's only source is required by the question.
#             Every indexed file is required by at least three single-turn answer questions, easy to
#             hard (tests/test_eval_answers.py)
#   absent    decline items only: patterns that would match the answer if the index held it. An answer
#             that declines and then asserts one of them anyway is wrong
#   turns     follow-up items only: the questions sent in one session, each with its own reference,
#             numbers, mentions, forbid and evidence
#   notes     where the facts are (file, page, table) and anything a maintainer must know; never sent to
#             the judge
#
# Figures and quotes come from company IR documents: references paraphrase them, and quote at most a
# short phrase.

- id: 1
  question: Which company had the highest revenue in calendar Q2 2026?
  kind: superlative
  expect: answer
  difficulty: medium
  route: [graph]
  companies: [Alphabet, NVIDIA]
  demo: true
  reference: Alphabet had the highest revenue in calendar Q2 2026, at $119,796M. NVIDIA had the second-highest revenue in calendar Q2 2026, at $96,221M.
  numbers:
  - {text: '$119,796M'}
  - {text: '$96,221M', required: false}
  mentions:
  - {any: ['Alphabet|Google'], required: true}
  - {any: ['NVIDIA'], required: false}
  forbid:
  - '\b(?:NVIDIA|Microsoft|Meta|AMD|Broadcom|Intel|Micron)\b\**(?:''s|’s)?\**(?: \([A-Z]{2,5}\))?,? (?:had|has|reported|posted|recorded|generated|delivered|achieved|earned|was|is)(?: the)? (?:highest|largest|biggest|greatest|top|most)[- ](?:quarterly |total |overall )?(?:revenues?|sales)\b'
  - '(?:highest|largest|biggest|greatest|top|most)[- ](?:quarterly |total |overall )?(?:revenues?|sales)\b(?:(?!runner|second|follow|next|behind|then|after|but|while|although|though|however)[^.;:,\n]){0,50}?\b(?:was|is|were|belongs to|goes to|went to|came from)\s+\**(?:the )?\b(?:NVIDIA|Microsoft|Meta|AMD|Broadcom|Intel|Micron)\b'
  - '(?:highest|largest|biggest|greatest|top|most)[- ](?:quarterly |total )?(?:revenues?|sales)\b[^.;:\n]{0,25}?:\s*\**\b(?:NVIDIA|Microsoft|Meta|AMD|Broadcom|Intel|Micron)\b'
  - '\b(?:NVIDIA|Microsoft|Meta|AMD|Broadcom|Intel|Micron)\b\**(?:''s|’s)?\**,? (?:quarterly |total )?(?:revenues?|sales)\b(?: of (?:[^.;]|\.\d){0,30}?)? (?:was|were|is|are|ranked|ranks|came in|stood) (?:as )?(?:the )?(?:highest|largest|biggest|greatest|top|most)\b'
  - '\b(?:NVIDIA|Microsoft|Meta|AMD|Broadcom|Intel|Micron)\b\**(?:''s|’s)?\**,? (?:led|leads|topped|tops|ranked first|ranks first|came first|comes first|came out on top)\b(?:(?!Alphabet|Google|but|while|although|though|however)[^.;\n]){0,40}?\b(?:revenues?|sales)\b'
  evidence:
  - fact: 'Alphabet is first: 119796 USD millions (Highest revenue, CY2026 Q2)'
    files: [ai_earnings_comparison.xlsx]
    all: ['Ranking ''Highest revenue, CY2026 Q2'': Company is Alphabet; Value is 119796(?![\d.])']
  - fact: 'NVIDIA is second: 96221 USD millions'
    files: [ai_earnings_comparison.xlsx]
    all: ['Ranking ''Highest revenue, CY2026 Q2'': Company is [\w&.'' -]+?; Value is -?[\d.]+; Runner-up is NVIDIA; Runner-up value is 96221(?![\d.])']
  notes: 'Workbook > Rankings, row ''Highest revenue, CY2026 Q2'' (Alphabet 119796, runner-up NVIDIA 96221, USD millions). No single document compares the 8 companies, so only the workbook answers this (the A2A XLSX before/after demo). Old reference: ''Alphabet, $119,796M. Runner-up NVIDIA, $96,221M''. Evidence: the Rankings row, the one passage that says who is first and second; a company''s own figure, in the workbook''s metric sheet or in its own documents, doesn''t say it ranks first.'

