e six-month column 74,421 = 24,077 + 50,344 confirms the column order). Companies'' own figures keep NVIDIA first (NVIDIA $21,341M, Microsoft $19.6B, Micron $18.3B), so the hop is robust. Principal-payments pattern loosened to allow ''( 59 )'' spacing in Document Intelligence text.'

