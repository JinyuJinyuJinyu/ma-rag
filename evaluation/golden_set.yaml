mong its financing partners; Alphabet''s $49.6B equity raise (item 48) is equity, not debt. Forbid: a long-term debt balance ($83.7B, $98.2B) given as the amount raised; the $49.6B equity raise called debt. Not item 48 (equity raise and the ATM). Verified against the original PDFs: GOOGL p.2, p.5, p.7 and META p.6, p.7 figures as stated; the GOOGL transcript also gives the long-term debt balance ($98.2B, p.11) and the META transcript the debt balance ($83.7B, p.5), neither of which is a required fact.'

