ck: the question excludes shares withheld for employee taxes, since AMD''s cash flow statement lists those repurchases ($207M) apart from its buybacks (none in the quarter).'

- id: 99
  question: In their latest quarterly results (NVIDIA's fiscal Q2 2027, Broadcom's fiscal Q3 2026 and Intel's Q2 2026, the quarter ended June 27, 2026), do NVIDIA, Broadcom and Intel exclude stock-based compensation from their non-GAAP results, and how much of it did Broadcom and Intel add back to reach non-GAAP operating income?
  kind: compare
  expect: answer
  difficulty: hard
  route: [graph]
  companies: [NVIDIA, Broadcom, Intel]
  reference: NVIDIA no longer excludes stock-based compensation from its non-GAAP measures. The change took effect in the first quarter of fiscal 2027, and NVIDIA updated its historical non-GAAP figures to include the expense. Broadcom still excludes stock-based compensation from its non-GAAP results. In fiscal Q3 2026 (the quarter ended August 2, 2026), Broadcom added back $2,019M of stock-based compensation, down from $2,322M a year earlier, taking GAAP operating income of $15,955M to non-GAAP operating income of $20,095M. Intel also excludes share-based compensation from its non-GAAP measures. In Q2 2026, Intel added back $687M of share-based compensation ($664M a year earlier), taking GAAP operating income of $1,796M to non-GAAP operating income of $2,770M.
  numbers:
  - {text: '$2,019M'}
  - {text: $687M}
  - {text: '$2,322M', required: false}
  - {text: $664M, required: false}
  - {text: '$20,095M', required: false}
  - {text: '$2,770M', required: false}
  mentions:
  - {any: ['\bNVIDIA\b(?:[^.;\n]|\.\d){0,120}?(?:no longer exclud|stopped exclud|ceased exclud|does not exclud|doesn''t exclud|do not exclud|not exclud|no longer remov|no longer strip|no longer add|now includ|(?:began|begun|started|starting) (?:to )?includ|(?:has|have) (?:been )?includ|no longer adjust|no longer back(?:s|ed)? out|now (?:treat|count|deduct)s? (?:stock|share)[- ]based)', '\bNVIDIA\b(?:[^.;\n]|\.\d){0,60}?\bincludes?\b(?:[^.;\n]|\.\d){0,30}?(?:(?:stock|share)[- ]based|\bSBC\b)', '(?:no longer exclud|stopped exclud|ceased exclud)(?:[^.;\n]|\.\d){0,80}?\bNVIDIA\b', '\bNVIDIA\b(?:[^.;\n]|\.\d){0,120}?\bexclud\w*\b(?:[^.;\n]|\.\d){0,60}?\bnot (?:stock|share)[- ]based'], required: true}
  - {any: ['(?:first quarter|Q1) (?:of )?(?:fiscal )?(?:year )?(?:20)?27|fiscal 2027'], required: false}
  forbid:
  - '\bNVIDIA(?:''s)?(?: non-GAAP (?:results|measures|figures|metrics|financial measures))? (?:still |continues to |also )?exclud(?:es|ed|e)\b(?:(?!\bno longer\b|\bnot\b|\bonly\b)[^.;\n]){0,30}?(?:(?:stock|share)[- ]based|\bSBC\b)'
  evidence:
  - fact: 'NVIDIA: from the first quarter of fiscal 2027 its non-GAAP measures no longer exclude stock-based compensation; historical non-GAAP figures updated'
    files: [NVDA_FY2027-Q2_cfo_commentary.pdf]
    all: ['no longer exclude stock.based compensation', 'historical non.? ?GAAP financial information presented has been updated']
  - fact: Broadcom adds back $2,019M of stock-based compensation (vs $2,322M a year earlier) to reach non-GAAP operating income of $20,095M in fiscal Q3 2026
    files: [AVGO_FY2026-Q3_press_release.pdf]
    all: ['Stock-based compensation expense 2,019 2,092 2,322', 'Operating income on non-GAAP basis \$ ?20,095']
  - fact: 'Intel adds back $687M of share-based compensation (vs $664M): GAAP operating income $1,796M to non-GAAP $2,770M in Q2 2026'
    files: [INTC_FY2026-Q2_press_release.html]
    all: ['GAAP operating income \(loss\)[ |$]*1,796', 'Share-based compensation[ |]*687[ |]*664', 'Non-GAAP operating income \(loss\)[ |$]*2,770']
  notes: 'NVDA_FY2027-Q2_cfo_commentary.pdf p.5 (Non-GAAP Measures): beginning in the first quarter of fiscal 2027, NVIDIA''s non-GAAP measures no longer exclude stock-based compensation; historical non-GAAP information updated to include it (so NVIDIA''s reconciliation adds back only acquisition-related and other costs). AVGO_FY2026-Q3_press_release.pdf p.2 (non-GAAP information excludes stock-based compensation, among others) and p.3 reconciliation: operating income on GAAP basis $15,955M + amortization 2,006 + stock-based compensation 2,019 + restructuring 115 = non-GAAP $20,095M; Q3 FY25 SBC 2,322. INTC_FY2026-Q2_press_release.html, Supplemental Reconciliations: GAAP operating income $1,796M + acquisition-related 117 + share-based compensation 687 (664 in Q2 2025) + restructuring 170 = non-GAAP $2,770M; the Explanation of Non-GAAP Measures says Intel excludes share-based compensation for comparability with peers. Sole source (xref ''no longer exclude'', ''2,019'', ''687''): NVIDIA''s policy change only in the CFO commentary (the transcript doesn''t mention it); the add-backs only in the Broadcom and Intel releases; the workbook has no non-GAAP data. Not covered by draft na-1 (NVIDIA GAAP vs non-GAAP net income, driven by equity-security gains). Hard: three files from three companies; policy plus figures compared side by side. Forbid: NVIDIA asserted to still exclude stock-based compensation. VERIFIER: NVDA CFO commentary p.5, AVGO release p.2-3 (columns Q3 FY26, Q2 FY26, Q3 FY25, 9M FY26, 9M FY25: 15,955 + 2,006 + 2,019 + 115 = 20,095) and INTC release reconciliation (1,796 + 117 + 687 + 170 = 2,770) re-read; the NVDA transcript never mentions stock-based compensation. Changes: the question now anchors each company''s period (NVIDIA''s was missing); the NVIDIA mention is tied to NVIDIA (before, ''Broadcom''s adjustments include stock-based compensation'' satisfied it); the Broadcom unit drops the GAAP operating income row to keep the span about 185 characters instead of 354 (a live PDF chunk may not hold the whole reconciliation block).'

