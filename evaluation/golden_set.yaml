- id: 58
  question: How does the comparison workbook define free cash flow, and why can its figure differ from a company's own free cash flow measure?
  kind: explanation
  expect: answer
  difficulty: easy
  route: [graph]
  companies: [Intel, Micron]
  reference: The comparison workbook defines free cash flow as operating cash flow minus capital expenditures, a value it derives rather than reads from a filing. Its capital expenditures are the gross cash paid for property, plant and equipment, so government incentives and partner contributions (Intel, Micron) are not netted. Companies' own free cash flow measures can differ from the workbook's figure because they use their own definitions. For example, Intel's adjusted free cash flow nets capital-related government incentives and partner contributions against its capital spending and also subtracts finance lease payments.
  mentions:
  - {any: ['operating cash|cash flows? (?:provided by|from) operat|operating activities|cash (?:generated |provided )?(?:from|by) operations'], required: true}
  - {any: ['capital expenditure|capex|property,? plant'], required: true}
  - {any: ['incentive|partner contribution|\bgross\b|finance lease|adjusted free cash flow|\bIntel\b'], required: true}
  - {any: ['\bIntel\b'], required: false}
  evidence:
  - fact: Workbook free cash flow = operating cash flow minus capital expenditures (derived)
    files: [ai_earnings_comparison.xlsx]
    all: ['Term ''Free cash flow'': Meaning is Operating cash flow minus capital expenditures']
  - fact: Workbook capex is gross cash paid for PP&E; incentives and partner contributions are not netted
    files: [ai_earnings_comparison.xlsx]
    all: ['Term ''Capital expenditures'': Meaning is Cash paid for property, plant and equipment', 'gross spending: government incentives and partner contributions \(Intel, Micron\) are not netted']
  - fact: 'Companies'' own FCF measures differ: Intel''s adjusted FCF nets partner contributions and incentives'
    any_of:
    - {files: [ai_earnings_comparison.xlsx], all: ['own free cash flow measures can differ', 'Intel''s adjusted free cash flow nets partner contributions and incentives']}
    - {files: [INTC_FY2026-Q2_press_release.html], all: ['Adjusted free cash flow is operating cash flow adjusted for', 'government incentives', 'partner contributions']}
  notes: 'ai_earnings_comparison.xlsx, Definitions sheet rows ''Free cash flow'' (operating cash flow minus capital expenditures, derived; companies'' own measures can differ, e.g. Intel''s adjusted free cash flow) and ''Capital expenditures'' (cash paid for PP&E, gross; incentives and partner contributions not netted; NVIDIA''s line also includes intangibles), one chunk. INTC_FY2026-Q2_press_release.html defines Intel''s adjusted free cash flow (operating cash flow adjusted for PP&E additions net of capital-related government incentives and net SCIP partner contributions, and for payments on finance leases). The third required mention checks the ''why'' half (incentives, partner contributions, gross capex, finance leases, or Intel''s adjusted measure). Illustration, not required: Intel CY2026 Q2 workbook FCF is $4,450M ($7,006M - $2,556M) while Intel''s own adjusted free cash flow is -$8,419M; Intel''s own gross capital expenditures line ($2,652M) also differs from the workbook''s $2,556M. Meta''s own Q2 2026 free cash flow ($784M, after finance lease principal) differs from the workbook''s $1,746M too.'

