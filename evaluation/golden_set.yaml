- id: 95
  question: How much did Microsoft (fiscal Q4 2026, April to June 2026), Alphabet and Meta (Q2 2026) each say they spent on capital expenditures in the quarter, and what did each say the spending went to, including any finance leases counted in the figure?
  kind: compare
  expect: answer
  difficulty: hard
  route: [graph]
  companies: [Microsoft, Alphabet, Meta]
  reference: Microsoft said its capital expenditures were $41B in fiscal Q4 2026 (April to June 2026). Roughly two thirds of Microsoft's capex went to short-lived assets, primarily CPUs and GPUs, and the rest to long-lived assets. Microsoft's figure includes finance leases, which were $5.6B in the quarter and were mainly for large datacenter sites. Microsoft's cash paid for property, plant and equipment was $35.8B. Alphabet said its CapEx was $44.9B in Q2 2026, with the vast majority in technical infrastructure for AI. About 60% of Alphabet's technical infrastructure investment in the quarter went to servers and 40% to data centers and networking equipment. Alphabet's $44.9B equals the purchases of property and equipment in its cash flow statement ($44,924M), and Alphabet cited no finance leases. Meta said its Q2 2026 capital expenditures, including principal payments on finance leases, were $31.1B. Meta said the spending was driven by investments in servers, data centers and network infrastructure.
  numbers:
  - {text: $41B}
  - {text: $5.6B}
  - {text: $44.9B}
  - {text: 60%}
  - {text: 40%}
  - {text: $31.1B}
  - {text: $35.8B, required: false}
  mentions:
  - {any: ['short[- ]lived', 'CPUs? and GPUs?', 'two[- ]thirds', '2/3'], required: true}
  - {any: ['data[- ]?cent(?:er|re) sites'], required: false}
  - {any: ['network(?:ing)? (?:infrastructure|equipment)'], required: false}
  - {any: ['\bMeta\b(?:[^.;\n]|\.\d){0,200}?\b(?:servers?|data ?cent(?:er|re)s?|network(?:ing)? infrastructure)\b', '\b(?:servers?|data ?cent(?:er|re)s?|network(?:ing)? infrastructure)\b(?:[^.;\n]|\.\d){0,120}?\bMeta\b'], required: true}
  evidence:
  - fact: Microsoft fiscal Q4 2026 capex $41B including finance leases of $5.6B (mostly large datacenter sites); roughly two thirds on short-lived assets (CPUs and GPUs)
    files: [MSFT_FY2026-Q4_transcript.docx]
    all: ['Capital expenditures were \$?41 billion', 'two thirds of our capex was for short-lived assets', 'finance leases were \$?5\.6 billion']
  - fact: Alphabet Q2 2026 CapEx $44.9B; about 60% of technical-infrastructure investment in servers, 40% in data centers and networking equipment
    files: [GOOGL_FY2026-Q2_transcript.pdf]
    all: ['CapEx was \$?44\.9 billion', '60 ?% of our investment in technical infrastructure']
  - fact: Meta Q2 2026 capex including principal payments on finance leases $31.1B, driven by servers, data centers and network infrastructure
    files: [META_FY2026-Q2_transcript.pdf]
    all: ['principal payments on finance leases, were \$?31\.1 billion', 'servers, data centers,? and network infrastructure']
  notes: 'MSFT_FY2026-Q4_transcript.docx, Amy Hood''s prepared remarks (after operating expenses): capex $41B incl. higher component pricing; roughly two thirds short-lived assets (primarily CPUs and GPUs), the rest long-lived; total finance leases $5.6B, primarily large datacenter sites; cash paid for PP&E $35.8B. GOOGL_FY2026-Q2_transcript.pdf p.11 (CFO Anat Ashkenazi): CapEx $44.9B, vast majority technical infrastructure for AI; ~60% servers, 40% data centers and networking equipment. META_FY2026-Q2_transcript.pdf p.5 (CFO Susan Li): capex incl. principal payments on finance leases $31.1B, driven by servers, data centers and network infrastructure. Sole source (xref ''41 billion'', ''two thirds'', ''short-lived'', ''5.6 billion''; ''60% of our investment'', ''40% was in data centers''; ''network infrastructure''): each mix statement is only in its call transcript. The bare amounts appear elsewhere and are the same facts: Alphabet''s 44,924 (GOOGL press release cash flow, workbook), Microsoft''s 35,802 cash capex (MSFT press release, workbook), Meta''s ''$31.08 billion'' incl. finance leases (META press release, without the drivers); the units hold the mix, which only the calls give, and each needs its transcript chunk. The workbook''s capex is purchases of PP&E only (MSFT 35802, GOOGL 44924, META 30116), so it excludes finance leases and can''t answer this. Hard: three files (one call per company), side-by-side comparison. VERIFIER: all three transcript passages re-read. Microsoft''s ''$41 billion'' sentence does not itself say it includes finance leases, but the same remarks say ''Finance leases are included in capital expenditures while operating leases are not'' and $35.8B cash PP&E + $5.6B finance leases = $41.4B, so the reference''s claim holds. Alphabet''s call and release never mention finance leases (xref ''finance lease'': INTC, META, MSFT only); the reference now says so, since the question asks about finance leases for each company. The Alphabet unit keeps the amount and the 60% split (span about 210 characters; with the 40% clause it was 280, over the splitter''s 240-character overlap, so a live PDF chunk might not hold all three). Meta''s amount-with-finance-leases fact is also existing item 14''s first unit; this item adds the drivers and the cross-company comparison. Second check: a required mention now asks for Meta''s drivers (servers, data centers, network infrastructure), which only the call gives; the press release has the $31.08B without them.'

- id: 96
  question: On their latest earnings calls in August 2026 (NVIDIA's fiscal Q2 2027 call and AMD's Q2 2026 call), what revenue per gigawatt of AI data center capacity did NVIDIA and AMD each cite, and how much has NVIDIA's figure grown from its Hopper generation to Vera Rubin?
  kind: compare
  expect: answer
  difficulty: hard
  route: [graph]
  companies: [NVIDIA, AMD]
  reference: On its fiscal Q2 2027 call, NVIDIA said its revenue opportunity per gigawatt grew from about $18B with Hopper to about $25B with Grace Blackwell and about $40B with Vera Rubin. That is about 2.2 times the Hopper level, an increase of about 122%. On its Q2 2026 call, AMD did not give a precise figure. AMD CEO Lisa Su said AMD's revenue per gigawatt is in the double-digit billions of dollars and remains in that range. She said this in reply to an analyst who estimated at least $15B per gigawatt for AMD.
  numbers:
  - {text: $40B}
  - {text: $25B, required: false}
  - {text: $18B}
  - {text: 122%, required: false}
  mentions:
  - {any: ['double[- ]digit', 'tens of billions'], required: true}
  - {any: ['\b12[0-2](?:\.\d+)? ?(?:%|percent)', '\b2\.2\d? ?(?:x|times|-?fold)\b', '(?:more than|over|above) (?:doubled|double|twice)', '(?<![\d.,])\$?22 ?(?:billion|bn|B)\b', 'more than (?:2|two) ?(?:x|times)\b'], required: false}
  - {any: ['Blackwell'], required: false}
  forbid:
  - '\bAMD(?:''s|’s)? (?:own )?(?:revenue|figure|estimate|opportunity)(?: per (?:gigawatt|GW))? (?:is|was|of|at|equals|stands at) (?:about |roughly |approximately |around |~)?\$?40 ?(?:billion|bn|B)\b'
  - '\bAMD\b(?:(?!analyst|estimat|assum|Vivek|Arya|\bnot\b|n''t\b|rather than|instead of|declin|reject|question|asked)[^.;\n]){0,80}?(?:at least |about |roughly |approximately |around |~)?\$ ?15 ?(?:billion|bn|B)\b[^.;\n]{0,30}?per (?:gigawatt|GW)'
  - '\bAMD\b(?:(?!analyst|estimat|assum|Vivek|Arya|\bnot\b|n''t\b)[^.;\n]){0,60}?per (?:gigawatt|GW)(?:(?!analyst|estimat|assum|Vivek|Arya|\bnot\b|n''t\b)[^.;\n]){0,25}?\b(?:is|was|of|at|equals|around|about|roughly|approximately)\s+(?:at least |about |roughly |approximately |around |~)?\$ ?15 ?(?:billion|bn|B)\b'
  evidence:
  - fact: 'NVIDIA revenue opportunity per gigawatt: about $18B (Hopper), $25B (Grace Blackwell), $40B (Vera Rubin)'
    files: [NVDA_FY2027-Q2_transcript.pdf]
    all: ['\$?18 billion per gigawatt', '\$?25 billion', '\$?40 billion']
  - fact: 'AMD revenue per gigawatt: ''double digit billions'', still in that range'
    files: [AMD_FY2026-Q2_transcript.pdf]
    all: ['revenue per gigawatt', 'double.digit billions']
  notes: 'NVDA_FY2027-Q2_transcript.pdf p.4 (CFO prepared remarks: since Hopper the revenue opportunity grew from roughly $18 billion per gigawatt to $25 billion with Blackwell, to $40 billion with Vera Rubin) and p.10 (Jensen Huang answering Stacy Rasgon: about $18B Hopper, $25B Grace Blackwell, $40B Vera Rubin per gigawatt); p.9 says a gigawatt data center costs about $60B in total today (total investment, not NVIDIA revenue). AMD_FY2026-Q2_transcript.pdf p.10 (Lisa Su answering Vivek Arya, who assumed about 3 GW for 2027 and at least $15B per GW): revenue per gigawatt ''double digit billions'', still in that range. Sole source (xref ''per gigawatt'', ''double digit billions'', ''18 billion''): NVIDIA''s figures only in its transcript (the CFO commentary instead sizes PORTS-Pike at ~1.5M GPUs or $150-200B per generation); AMD''s only in its transcript. AMD''s ''up to 2 gigawatts'' Anthropic deal (both AMD files) is not asked. Derived: 40/18 = 2.2x (+122%), +60% vs Blackwell. Hard: two files, a calculation on NVIDIA''s side and an imprecise Q&A answer on AMD''s side that the answer must report as such ($15B is the analyst''s estimate, not AMD''s). Forbid: AMD credited with NVIDIA''s $40B. VERIFIER: NVDA transcript p.4 (CFO) and p.10-11 (Huang, twice) and AMD transcript p.10 (Su to Arya) re-read. Changes: $25B made optional (the question asks Hopper to Vera Rubin; a full answer can skip Blackwell); the growth the question asks for is now a required mention (122%, 2.2x, more than doubled, or +$22B); new forbid patterns catch the likeliest error, crediting AMD with the analyst''s ''$15 billion per gigawatt'' (they skip sentences that attribute it to the analyst or say AMD did not confirm it). Difficulty kept hard: two files, the NVIDIA part needs a calculation and the AMD part needs management''s answer told apart from the analyst''s estimate in the same exchange.'

- id: 97
  question: How much inventory did NVIDIA (at the end of fiscal Q2 2027), AMD (at the end of Q2 2026) and Micron (at the end of fiscal Q3 2026) hold, and what did each company say about why it changed or how tight it is?
